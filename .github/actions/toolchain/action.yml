name: Toolchain
description: Restores the Go caches and gets the toolchain image for scripts/toolchain.sh. Needs a checkout.
outputs:
  cache-key:
    description: Key the Go caches are stored under for this go.sum.
    value: toolchain-linux-x86_64-${{ hashFiles('go.sum') }}
  cache-hit:
    description: "'true' when the caches were restored from exactly that key."
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore Go caches
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/status-go-toolchain/go-build
          ~/.cache/status-go-toolchain/go-mod
        key: toolchain-linux-x86_64-${{ hashFiles('go.sum') }}
        restore-keys: toolchain-linux-x86_64-
    - name: Toolchain image
      shell: bash
      run: scripts/toolchain.sh go version
