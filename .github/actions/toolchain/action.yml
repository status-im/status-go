name: Toolchain
description: Restores the Go caches and gets the toolchain image for scripts/toolchain.sh. Needs a checkout.
inputs:
  token:
    description: Token used to pull the toolchain image from GHCR.
    default: ${{ github.token }}
outputs:
  cache-key:
    description: Key the Go caches are stored under for this go.sum.
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: "'true' when the caches were restored from exactly that key."
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # hashFiles is only available inside steps, not in the outputs above.
    - id: key
      shell: bash
      run: echo "key=toolchain-linux-x86_64-${{ hashFiles('go.sum') }}" >> "$GITHUB_OUTPUT"
    - name: Restore Go caches
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/status-go-toolchain/go-build
          ~/.cache/status-go-toolchain/go-mod
        key: ${{ steps.key.outputs.key }}
        restore-keys: toolchain-linux-x86_64-
    # Without access to the published image the script builds it instead.
    - name: Toolchain image
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.token }}
        GHCR_USER: ${{ github.actor }}
      run: |
        echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin || true
        scripts/toolchain.sh go version
