name: Unit test slice
description: Runs one slice of the unit tests on the prepared tree. Needs a checkout, MAKE_ARGS and UNIT_TEST_PART.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: prepared-tree
        path: ${{ runner.temp }}
    - name: Unpack the prepared tree
      shell: bash
      run: tar -xf "$RUNNER_TEMP/prepared-tree.tar"
    - name: Unit tests
      shell: bash
      run: |
        echo "REPORT_NAME=unit-test-reports-${UNIT_TEST_PART//[:\/]/-}" >> "$GITHUB_ENV"
        scripts/toolchain.sh make test-unit-prepared $MAKE_ARGS
    # With CI=true the test output goes to files, not to the job log.
    - name: Show test logs
      if: failure()
      shell: bash
      run: tail -n 200 test_*.log
    - name: Show reruns in the summary
      if: always()
      shell: bash
      run: |
        reports=(report_rerun_fails_*.txt)
        [ ! -s "${reports[0]}" ] || { echo '```'; cat "${reports[@]}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ env.REPORT_NAME }}
        path: |
          report_*.xml
          report_rerun_fails_*.txt
          test_*.log
          test-coverage.html
        if-no-files-found: ignore
        retention-days: 14
