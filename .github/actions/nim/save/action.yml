name: Save Nim
description: Saves the cache that ./.github/actions/nim restores. Run it after the build, which fills nimbledeps.
inputs:
  key:
    description: The cache-key output of ./.github/actions/nim.
    required: true
runs:
  using: composite
  steps:
    # The C sources and objects a compiler was built from are 1.9 GB each and
    # are not needed to run it.
    - name: Trim the Nim build trees
      shell: bash
      run: |
        rm -rf .nim_runtime/c_code .nim_runtime/nimcache \
          nimbledeps/pkgs2/nim-*/c_code nimbledeps/pkgs2/nim-*/nimcache
        du -sh .nim_runtime nimbledeps
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .nim_runtime
          nimbledeps
        key: ${{ inputs.key }}
