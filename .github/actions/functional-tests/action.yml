name: Functional test setup
description: Installs what the functional tests need on the runner and loads the status-backend image another job built. Needs a checkout.
inputs:
  image-artifact:
    description: Artifact that holds image.tar.zst.
    required: true
  proxy-user:
    description: Status proxy user for the tests that ask real routes. Empty leaves those tests skipped.
    default: ''
  proxy-password:
    description: Password of the Status proxy user.
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/versions
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    # Its pattern takes the generator's progress lines for compile errors.
    - shell: bash
      run: echo "::remove-matcher owner=go::"
    - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: ${{ env.PROTOC_VERSION }}
        repo-token: ${{ github.token }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: test/functional/requirements.txt
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ runner.temp }}
    - shell: bash
      run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
    # The tests tell "no credentials" by the variable being absent, so an empty
    # secret must not set it.
    - name: Status proxy credentials
      shell: bash
      env:
        PROXY_USER: ${{ inputs.proxy-user }}
        PROXY_PASSWORD: ${{ inputs.proxy-password }}
      run: |
        [ -n "$PROXY_USER" ] || exit 0
        {
          echo "STATUS_BUILD_PROXY_USER=$PROXY_USER"
          echo "STATUS_BUILD_PROXY_PASSWORD=$PROXY_PASSWORD"
        } >> "$GITHUB_ENV"
    # The toolchain image has it; these tests run on the runner itself.
    - name: Codecov CLI
      if: env.FUNCTIONAL_TESTS_REPORT_CODECOV == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/codecov"
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/codecov/codecov" "https://cli.codecov.io/v$CODECOV_VERSION/linux/codecov"
        echo "$CODECOV_SHA256  $RUNNER_TEMP/codecov/codecov" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/codecov/codecov"
        echo "$RUNNER_TEMP/codecov" >> "$GITHUB_PATH"
