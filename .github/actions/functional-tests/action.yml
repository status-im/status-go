name: Functional test setup
description: Installs what the functional tests need on the runner and loads the status-backend image another job built. Needs a checkout.
inputs:
  image-artifact:
    description: Artifact that holds image.tar.zst.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/versions
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false
    # Its pattern takes the generator's progress lines for compile errors.
    - shell: bash
      run: echo "::remove-matcher owner=go::"
    - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: ${{ env.PROTOC_VERSION }}
        repo-token: ${{ github.token }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: test/functional/requirements.txt
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ runner.temp }}
    - shell: bash
      run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
