name: Build macOS
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-macos-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # One runner per library: the two builds do not wait for each other.
  libraries:
    name: macos/aarch64 (${{ matrix.library }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: static
            target: statusgo-library
            files: |
              build/bin/libstatus.a
              build/bin/libstatus.h
          - library: shared
            target: statusgo-shared-library
            files: |
              build/bin/libstatus.dylib
              build/bin/libstatus.h
              build/nim-sds/build/libsds.dylib
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NIM_SDS_SOURCE_DIR: ${{ github.workspace }}/build/nim-sds
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pkg/version takes the version from git describe --tags
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/versions
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Protocol buffer compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - name: Toolchain versions
        run: |
          go version
          protoc --version
          nim --version | head -n 1
          nimble --version
          git describe --tags
      - uses: ./.github/actions/go-cache
        with:
          name: macos-aarch64
      # The target generates the code itself, once.
      - name: Library
        run: make ${{ matrix.target }}
      - name: Upload library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: status-go-macos-aarch64-${{ matrix.library }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
      # One job writes the caches, so the key has one owner.
      - uses: ./.github/actions/go-cache/save
        if: matrix.library == 'static'

  # One check name for branch rules.
  macos:
    name: macos/aarch64
    if: always()
    needs: libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: jq -e 'all(. == "success")' <<< '${{ toJSON(needs.*.result) }}'
