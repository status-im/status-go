name: TEMP

permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop

jobs:
  golangci:
    name: test go tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21.0'
      - name: go tool
        run: |
          go tool -n compile
      - name: test
        run: |
          go test ./temp