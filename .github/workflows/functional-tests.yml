name: Functional Tests
on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The compose file defaults to the Harbor mirror of this Docker Hub image.
  WAKU_IMAGE: wakuorg/nwaku:v0.39.2
  # The test clients name their containers after it.
  BUILD_ID: ${{ github.run_id }}
  FUNCTIONAL_TESTS_REPORT_CODECOV: false
jobs:
  rpc:
    name: rpc
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh describes the commit from the nearest tag
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '36.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the status-backend image, starts Anvil and a Waku fleet with docker
      # compose, and runs pytest against them. It needs docker on the host, so it
      # does not go through the toolchain container.
      - name: Functional tests
        run: make test-functional USE_LOGOS_STORAGE=true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-test-reports-rpc
          path: |
            test/functional/reports/*.xml
            test/functional/logs/*.log
            test/functional/coverage/coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # The same tests against status-backend images of the two previous releases.
  rpc-compat:
    name: rpc-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The runner script picks the releases to test against from these.
      CHANGE_TARGET: ${{ github.base_ref }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release tags pick the peers, and their sources are built here.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '36.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compatibility tests
        run: make test-functional-compatibility
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-test-reports-rpc-compat
          path: |
            test/functional/reports/*.xml
            test/functional/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
