name: Functional Tests
on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The compose file defaults to the Harbor mirror of this Docker Hub image.
  WAKU_IMAGE: wakuorg/nwaku:v0.39.2
  # The test clients name their containers after it.
  BUILD_ID: ${{ github.run_id }}
  FUNCTIONAL_TESTS_REPORT_CODECOV: false
  # Built by the image job, loaded by the test jobs.
  FUNCTIONAL_TESTS_DOCKER_IMAGE: status-backend-under-test
jobs:
  # The status-backend image under test, built once for all the jobs that test it.
  image:
    name: image (${{ matrix.tests }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same builds `make test-functional USE_LOGOS_STORAGE=true` and
          # `make test-functional-compatibility` make.
          - tests: rpc
            logos-storage: true
          - tests: rpc-compat
            logos-storage: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the image
        env:
          FUNCTIONAL_TESTS_IMAGE_ONLY: true
          USE_LOGOS_STORAGE: ${{ matrix.logos-storage }}
        run: scripts/run_functional_tests.sh
      - name: Save the image
        run: docker save "$FUNCTIONAL_TESTS_DOCKER_IMAGE" | zstd -T0 -o "$RUNNER_TEMP/image.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: status-backend-image-${{ matrix.tests }}
          path: ${{ runner.temp }}/image.tar.zst
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          retention-days: 1

  # Starts Anvil and a Waku fleet with docker compose and runs pytest against the
  # image. It needs docker on the host, so it does not go through the toolchain container.
  rpc-tests:
    name: rpc (${{ matrix.shard }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Slices of the tests, see FUNCTIONAL_TESTS_SHARD in test/functional/conftest.py.
        shard: ['1/3', '2/3', '3/3']
    env:
      FUNCTIONAL_TESTS_SHARD: ${{ matrix.shard }}
      FUNCTIONAL_TESTS_SKIP_IMAGE_BUILD: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh describes the commit from the nearest tag
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/functional-tests
        with:
          image-artifact: status-backend-image-rpc
      - name: Functional tests
        run: make test-functional USE_LOGOS_STORAGE=true
      - uses: ./.github/actions/functional-tests/reports
        if: always()
        with:
          name: functional-test-reports-rpc-${{ strategy.job-index }}
  # The releases the compatibility tests talk to: the latest patch of the two
  # previous minor versions. The same choice scripts/run_functional_tests.sh makes.
  peers:
    name: peer releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: refs
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          own_minor="$(printf '%s' "$TARGET_BRANCH" | sed -nE 's|^release/([0-9]+)\.([0-9]+)\..*|v\1.\2|p')"
          refs="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            awk -F. -v own="$own_minor" '$1"."$2 != own && !seen[$1"."$2]++' | head -2 | jq -Rnc '[inputs]')"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "Peer releases: $refs"
          [ "$refs" != '[]' ]

  # The compatibility tests against one previous release each; within a job they run one by one.
  rpc-compat-tests:
    name: rpc-compat (${{ matrix.peer }})
    needs: [image, peers]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        peer: ${{ fromJSON(needs.peers.outputs.refs) }}
    env:
      FUNCTIONAL_TESTS_SKIP_IMAGE_BUILD: true
      PEER_REFS: ${{ matrix.peer }}
      # A release never changes, so its image is built once and kept in the registry.
      PEER_REGISTRY_IMAGE: ghcr.io/status-im/status-go-peer:${{ matrix.peer }}
      # The name the runner script gives a peer image, and reuses when it is there.
      PEER_LOCAL_IMAGE: statusgo-peer-${{ matrix.peer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The sources of the release are built here when the registry has no image.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/functional-tests
        with:
          image-artifact: status-backend-image-rpc-compat
      - name: Pull the peer image
        id: peer
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin || true
          if docker pull --quiet "$PEER_REGISTRY_IMAGE"; then
            docker tag "$PEER_REGISTRY_IMAGE" "$PEER_LOCAL_IMAGE"
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compatibility tests
        run: make test-functional-compatibility
      # Pull requests only read the registry: an image published there is used by every later run.
      - name: Publish the peer image
        if: >-
          always() && steps.peer.outputs.pulled != 'true' && github.repository == 'status-im/status-go' &&
          github.event_name != 'pull_request'
        run: |
          docker image inspect "$PEER_LOCAL_IMAGE" > /dev/null 2>&1 || exit 0
          docker tag "$PEER_LOCAL_IMAGE" "$PEER_REGISTRY_IMAGE"
          docker push "$PEER_REGISTRY_IMAGE" || echo "::warning::Could not publish $PEER_REGISTRY_IMAGE"
      - uses: ./.github/actions/functional-tests/reports
        if: always()
        with:
          name: functional-test-reports-rpc-compat-${{ matrix.peer }}
  # One check name each for branch rules, whatever the number of jobs behind it.
  rpc:
    name: rpc
    if: always()
    needs: rpc-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: jq -e 'all(. == "success")' <<< '${{ toJSON(needs.*.result) }}'
  rpc-compat:
    name: rpc-compat
    if: always()
    needs: rpc-compat-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: jq -e 'all(. == "success")' <<< '${{ toJSON(needs.*.result) }}'
