name: Build Windows
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-windows-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # One runner per library: the two builds do not wait for each other.
  libraries:
    name: windows/x86_64 (${{ matrix.library }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: static
            target: statusgo-library
            files: |
              build/bin/libstatus.a
              build/bin/libstatus.h
          - library: shared
            target: statusgo-shared-library
            files: |
              build/bin/libstatus.dll
              build/bin/libstatus.h
              build/nim-sds/build/libsds.dll
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      NIM_SDS_SOURCE_DIR: ${{ github.workspace }}/build/nim-sds
      # Nim dependency trees nest past MAX_PATH and Bash needs LF endings.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # pkg/version takes the version from git describe --tags
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/versions
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
          # Outside the checkout, which the build fingerprints.
          parent-nim-install-directory: ${{ runner.temp }}
      # MSYS2 supplies only the shell; Go, Nim, Git and the compiler come from the Windows PATH.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          path-type: inherit
          install: make unzip
      - name: Compiler, nimble and protoc
        run: .github/scripts/windows-toolchain.sh
      - uses: ./.github/actions/go-cache
        with:
          name: windows-x86_64
      - name: Toolchain versions
        run: |
          for tool in go nim nimble gcc mingw32-make make protoc git sh; do
            echo "$tool: $(command -v "$tool" || echo missing)"
          done
          go version
          nim --version | head -n 1
          nimble --version | head -n 1
          gcc --version | head -n 1
          mingw32-make --version | head -n 1
          protoc --version
          git --version
          git describe --tags
          go env GOCACHE GOMODCACHE
      # MinGW make: MSYS make would put POSIX paths into cgo flags that the native Go and gcc cannot resolve.
      - name: Library
        run: mingw32-make ${{ matrix.target }}
      - name: Upload library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: status-go-windows-x86_64-${{ matrix.library }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
      # One job writes the caches, so the key has one owner.
      - uses: ./.github/actions/go-cache/save
        if: matrix.library == 'static'

  # One check name for branch rules.
  windows:
    name: windows/x86_64
    if: always()
    needs: libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: jq -e 'all(. == "success")' <<< '${{ toJSON(needs.*.result) }}'
