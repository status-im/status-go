name: Pytest Lint

on:
  pull_request:
    branches:
      - develop
      - release/**
  push:
    branches:
      - "test-linting"

jobs:
  pytest-lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up virtual environment in /test/functional/
      run: |
        python -m venv test/functional/.venv

    - name: Install dependencies based on requirements.txt
      run: |
        source test/functional/.venv/bin/activate
        pip install -r test/functional/requirements.txt

    - name: Run pytest-lint
      run: |
        source test/functional/.venv/bin/activate
        make pytest-lint
