name: Go Lint
on:
  pull_request:
  # develop saves the Go caches that pull requests read.
  push:
    branches:
      - develop

permissions:
  contents: read # Keep permissions read-only. Required to provide `repo-token` for arduino/setup-protoc@v3 stage.

concurrency:
  group: go-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/versions

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Its own cache is saved again by every pull request.
          cache: false

      - uses: ./.github/actions/go-cache
        with:
          name: lint-linux-x86_64

      - name: Get dependencies
        run: go mod download

      - name: Setup Protocol Buffer Compiler
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache go-generate-fast
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-generate-fast
          key: go-generate-fast-${{ runner.os }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            go-generate-fast-${{ runner.os }}-

      - name: Generate
        env:
          GO_GENERATE_FAST_DIR: ~/.cache/go-generate-fast
        run: |
          make generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --build-tags=gowaku_no_rln,lint,use_logos_storage,use_torrent

      - name: lint-panics
        run: |
          make lint-panics USE_LOGOS_STORAGE=true USE_TORRENT=true

      - name: go mod tidy
        run: go mod tidy && git diff --exit-code

      - uses: ./.github/actions/go-cache/save

  migration-check:
    name: Check SQL migrations order
    # Compares a pull request with its base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run migration check
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          bash scripts/migration_check.sh
