name: Go Lint
on:
  pull_request:

permissions:
  contents: read # Keep permissions read-only. Required to provide `repo-token` for arduino/setup-protoc@v3 stage.

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Get dependencies
        run: go mod download

      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693
        with:
          nim-version: '2.2.10'

      - name: Setup Protocol Buffer Compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '36.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache go-generate-fast
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-generate-fast
          key: go-generate-fast-${{ runner.os }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum') }}
          restore-keys: |
            go-generate-fast-${{ runner.os }}-

      - name: Generate
        env:
          GO_GENERATE_FAST_DIR: ~/.cache/go-generate-fast
        run: |
          make generate

      # Keep native linker flags out of the host-side code generators.
      - name: Prepare native token catalogue
        run: |
          source scripts/tkl_env.sh
          printf '%s\n' "CGO_CFLAGS=$CGO_CFLAGS" "CGO_LDFLAGS=$CGO_LDFLAGS" \
            "NIM_TKL_INC_DIR=$NIM_TKL_INC_DIR" "NIM_TKL_LIB_DIR=$NIM_TKL_LIB_DIR" >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --build-tags=gowaku_no_rln,lint,use_logos_storage,use_torrent

      - name: lint-panics
        run: |
          # SDS/storage use stubs under the lint tag; keep Make from adding
          # their runtime libraries to the host analyzer's linker flags.
          make lint-panics USE_LOGOS_STORAGE=true USE_TORRENT=true \
            CGO_CFLAGS="$CGO_CFLAGS" CGO_LDFLAGS="$CGO_LDFLAGS"

      - name: go mod tidy
        run: go mod tidy && git diff --exit-code

  migration-check:
    name: Check SQL migrations order
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run migration check
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          bash scripts/migration_check.sh
