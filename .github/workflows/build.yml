name: Build
on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    name: linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh describes the commit from the nearest tag
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          cache-name: linux-${{ matrix.arch }}
      - name: Static library
        run: scripts/toolchain.sh make statusgo-library
      - name: Shared library
        run: scripts/toolchain.sh make statusgo-shared-library
      - name: Upload libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: status-go-linux-${{ matrix.arch }}
          path: |
            build/bin/libstatus.a
            build/bin/libstatus.h
            build/bin/libstatus.so.0
            build/libsds.so
          if-no-files-found: error
          retention-days: 7
      # The aarch64 caches are not kept: the repository's cache quota is nearly used.
      - uses: ./.github/actions/go-cache/save
        if: matrix.arch == 'x86_64'
