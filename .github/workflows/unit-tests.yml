name: Unit Tests
on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Make arguments for a tree that uses the prebuilt libstorage.
  MAKE_ARGS: >-
    USE_LOGOS_STORAGE=true USE_TORRENT=true
    LOGOS_STORAGE_LIB_DIR=${{ github.workspace }}/build/deps/logos-storage/build
    LOGOS_STORAGE_INC_DIR=${{ github.workspace }}/build/deps/logos-storage/library
  # Written by the prepare job, read by the protocol slices.
  UNIT_TEST_PROTOCOL_TESTS_FILE: build/protocol-tests.txt
jobs:
  # Generated code and native libraries, built once and handed to every test job.
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh describes the commit from the nearest tag
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Restore libstorage
        id: libstorage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/deps/logos-storage
          # The Makefile pins the logos-storage revision, the Dockerfile the compilers.
          key: libstorage-tree-linux-x86_64-${{ hashFiles('Makefile', 'Dockerfile') }}
      - name: Build libstorage
        if: steps.libstorage.outputs.cache-hit != 'true'
        run: |
          scripts/toolchain.sh make build-storage
          source=~/.cache/status-go-toolchain/logos-storage-nim
          mkdir -p build/deps/logos-storage/build
          cp "$source/build/libstorage.so" build/deps/logos-storage/build/
          cp -R "$source/library" build/deps/logos-storage/
      - name: Generate code, build libsds and libtkl
        run: scripts/toolchain.sh make test-unit-prep build-libtkl $MAKE_ARGS
      # Listing compiles the package; a dry run of one slice writes the list for all of them.
      - name: List the protocol tests
        env:
          UNIT_TEST_DRY_RUN: true
          UNIT_TEST_PART: protocol:1/1
        run: scripts/toolchain.sh make test-unit-prepared $MAKE_ARGS
      - name: Pack the prepared tree
        run: |
          # Generated files are the ignored ones; from build/ only the libraries are needed.
          {
            git ls-files -z --others --ignored --exclude-standard | grep -zvE '^(build|nimbledeps)/'
            printf '%s\0' build/libsds.so build/libsds.h build/deps "$UNIT_TEST_PROTOCOL_TESTS_FILE"
          } | tar --null --files-from=- -cf "$RUNNER_TEMP/prepared-tree.tar"
          ls -lh "$RUNNER_TEMP/prepared-tree.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-tree
          path: ${{ runner.temp }}/prepared-tree.tar
          if-no-files-found: error
          retention-days: 1

  coexistence:
    name: token library coexistence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: scripts/toolchain.sh make test-libtkl-coexistence

  tests:
    name: ${{ matrix.part }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Slices of the suite, see UNIT_TEST_PART in scripts/run_unit_tests.sh.
        part:
          - packages:1/3
          - packages:2/3
          - packages:3/3
          - protocol:1/10
          - protocol:2/10
          - protocol:3/10
          - protocol:4/10
          - protocol:5/10
          - protocol:6/10
          - protocol:7/10
          - protocol:8/10
          - protocol:9/10
          - protocol:10/10
    env:
      UNIT_TEST_PART: ${{ matrix.part }}
      UNIT_TEST_COUNT: 1
      UNIT_TEST_FAILFAST: true
      UNIT_TEST_RERUN_FAILS: true
      UNIT_TEST_USE_DEVELOPMENT_LOGGER: false
      UNIT_TEST_REPORT_CODECOV: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-tree
          path: ${{ runner.temp }}
      - name: Unpack the prepared tree
        run: tar -xf "$RUNNER_TEMP/prepared-tree.tar"
      - name: Unit tests
        run: scripts/toolchain.sh make test-unit-prepared V=1 $MAKE_ARGS
      # With CI=true the test output goes to files, not to the job log.
      - name: Show test logs
        if: failure()
        run: tail -n 200 test_*.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports-${{ strategy.job-index }}
          path: |
            report_*.xml
            report_rerun_fails_*.txt
            test_*.log
            test-coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # One check name for branch rules, whatever the number of slices.
  unit:
    name: unit
    if: always()
    needs: [coexistence, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          COEXISTENCE: ${{ needs.coexistence.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "coexistence: $COEXISTENCE, tests: $TESTS"
          [ "$COEXISTENCE" = success ] && [ "$TESTS" = success ]
