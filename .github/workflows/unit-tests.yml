name: Unit Tests
on:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Built once and handed to every test job.
  libstorage:
    name: libstorage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Restore libstorage
        id: libstorage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/status-go-toolchain/logos-storage-nim/build/libstorage.so
            ~/.cache/status-go-toolchain/logos-storage-nim/library
          # The Makefile pins the logos-storage revision, the Dockerfile the compilers.
          key: libstorage-linux-x86_64-${{ hashFiles('Makefile', 'Dockerfile') }}
      - name: Build libstorage
        if: steps.libstorage.outputs.cache-hit != 'true'
        run: scripts/toolchain.sh make build-storage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libstorage-linux-x86_64
          path: |
            ~/.cache/status-go-toolchain/logos-storage-nim/build/libstorage.so
            ~/.cache/status-go-toolchain/logos-storage-nim/library
          if-no-files-found: error
          retention-days: 1

  coexistence:
    name: token library coexistence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: scripts/toolchain.sh make test-libtkl-coexistence

  tests:
    name: ${{ matrix.part }}
    needs: libstorage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Slices of the suite, see UNIT_TEST_PART in scripts/run_unit_tests.sh.
        part:
          - packages:1/3
          - packages:2/3
          - packages:3/3
          - protocol:1/6
          - protocol:2/6
          - protocol:3/6
          - protocol:4/6
          - protocol:5/6
          - protocol:6/6
    env:
      UNIT_TEST_PART: ${{ matrix.part }}
      UNIT_TEST_COUNT: 1
      UNIT_TEST_FAILFAST: true
      UNIT_TEST_RERUN_FAILS: true
      UNIT_TEST_USE_DEVELOPMENT_LOGGER: false
      UNIT_TEST_REPORT_CODECOV: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/version.sh describes the commit from the nearest tag
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libstorage-linux-x86_64
          path: ~/.cache/status-go-toolchain/logos-storage-nim
      # /cache is ~/.cache/status-go-toolchain inside the toolchain container.
      - name: Unit tests
        run: >
          scripts/toolchain.sh make test-unit V=1 USE_LOGOS_STORAGE=true USE_TORRENT=true
          LOGOS_STORAGE_LIB_DIR=/cache/logos-storage-nim/build
          LOGOS_STORAGE_INC_DIR=/cache/logos-storage-nim/library
      # With CI=true the test output goes to files, not to the job log.
      - name: Show test logs
        if: failure()
        run: tail -n 200 test_*.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports-${{ strategy.job-index }}
          path: |
            report_*.xml
            report_rerun_fails_*.txt
            test_*.log
            test-coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # One check name for branch rules, whatever the number of slices.
  unit:
    name: unit
    if: always()
    needs: [coexistence, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          COEXISTENCE: ${{ needs.coexistence.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "coexistence: $COEXISTENCE, tests: $TESTS"
          [ "$COEXISTENCE" = success ] && [ "$TESTS" = success ]
