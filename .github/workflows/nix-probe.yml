name: Nix probe

# A one-off measurement of the Nix package build on a hosted runner. Not for merging.
on:
  push:
    branches:
      - ab/issue-23128-nix-probe

permissions:
  contents: read

env:
  PACKAGE: '.?submodules=1#status-go-library'
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    fallback = true

jobs:
  host:
    name: nix build (runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: |
          curl -sSfL https://releases.nixos.org/nix/nix-2.33.1/install | sh -s -- --daemon --yes
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

      - name: What would be built
        run: |
          nix --version
          nix config show sandbox
          df -h / /nix
          nix build --dry-run "$PACKAGE" 2>&1 | grep -E 'will be (built|fetched)'

      - name: Go modules
        run: time nix build -L --no-link "$PACKAGE.goModules"

      - name: Package
        run: time nix build -L "$PACKAGE"

      - name: Sizes
        if: always()
        run: |
          ls -la result/ result/* 2>/dev/null | head -30 || true
          df -h / /nix
          nix path-info --all --json | jq -r '
            (if type == "array" then . else [.[]] end) as $p
            | "all paths:    \($p | length) paths, \(($p | map(.narSize) | add) / 1048576 | floor) MiB",
              "built here:   \($p | map(select(.ultimate == true)) | length) paths, \(($p | map(select(.ultimate == true) | .narSize) | add // 0) / 1048576 | floor) MiB"'
          echo 'Largest paths built here:'
          nix path-info --all --json | jq -r '
            (if type == "array" then . else to_entries | map(.value + {path: .key}) end)
            | map(select(.ultimate == true)) | sort_by(-.narSize) | .[:15][]
            | "\(.narSize / 1048576 | floor) MiB\t\(.path)"'

  container:
    name: nix build (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build in the nixos/nix image
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e PACKAGE -e NIX_CONFIG nixos/nix:2.33.1 sh -c '
            set -eu
            git config --global --add safe.directory "*"
            nix --version
            nix config show sandbox
            time nix build -L --no-link "$PACKAGE.goModules"
            time nix build -L --no-link "$PACKAGE"
            du -sh /nix/store
          '
