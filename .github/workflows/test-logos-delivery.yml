name: Test Logos Delivery Nightly

on:
  workflow_dispatch:
  push:
    branches: ["chore/functional-waku-logosdeliverynode"]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  checks: write

concurrency:
  group: test-logos-delivery
  cancel-in-progress: false

jobs:
  functional-tests:
    name: Functional tests against Logos Delivery nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: logos-delivery-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: test/functional/docker-compose.anvil.yml:test/functional/docker-compose.waku.yml
      WAKU_IMAGE: quay.io/wakuorg/nwaku-pr:nightly-logosdeliverynode
      WAKU_STORE_MESSAGE_RETENTION_SECONDS: '60'
      USE_LOGOS_STORAGE: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/functional/requirements.txt

      - name: Install test dependencies
        run: |
          python -m venv test/functional/.venv
          test/functional/.venv/bin/pip install -r test/functional/requirements.txt

      - name: Resolve nightly image and record tested versions
        run: |
          mkdir -p test/functional/logs test/functional/reports
          docker pull "$WAKU_IMAGE"
          delivery_digest=$(docker image inspect "$WAKU_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "WAKU_IMAGE=$delivery_digest" >> "$GITHUB_ENV"
          {
            echo "status-go commit: $(git rev-parse HEAD)"
            echo "Logos Delivery tag: $WAKU_IMAGE"
            echo "Logos Delivery image: $delivery_digest"
          } | tee test/functional/logs/versions.log >> "$GITHUB_STEP_SUMMARY"

      - name: Build status-backend with Logos Storage
        run: |
          docker build . --tag statusgo-logos-delivery \
            --build-arg 'build_tags=gowaku_no_rln use_logos_storage' \
            --build-arg use_logos_storage=true

      - name: Start local fleet
        run: docker compose up --build --remove-orphans -d

      - name: Wait for fleet discovery
        timeout-minutes: 10
        run: |
          scanner_id=$(docker compose ps -aq wakufleet-scanner)
          test -n "$scanner_id"
          scanner_exit_code=$(timeout 540 docker wait "$scanner_id")
          if [ "$scanner_exit_code" != 0 ]; then
            docker logs "$scanner_id"
            echo '::error::Waku fleet discovery failed.'
            exit 1
          fi

      - name: Run functional RPC tests
        run: |
          test/functional/.venv/bin/pytest --reruns 2 -n 2 \
            -m rpc -c test/functional/pytest.ini \
            --log-cli-level=INFO \
            --docker_project_name="$COMPOSE_PROJECT_NAME" \
            --docker-image=statusgo-logos-delivery \
            --logs-dir=test/functional/logs \
            --junitxml=test/functional/reports/report.xml \
            test/functional

      - name: Publish test report
        if: always() && hashFiles('test/functional/reports/report.xml') != ''
        uses: dorny/test-reporter@95058abb17504553158e70e2c058fe1fda4392c2
        with:
          name: Logos Delivery Functional Test Report
          path: test/functional/reports/report.xml
          reporter: java-junit
          use-actions-summary: 'true'

      - name: Collect fleet logs
        if: always()
        run: |
          mkdir -p test/functional/logs
          docker compose ps -a > test/functional/logs/compose-status.log
          docker compose logs --no-color --timestamps > test/functional/logs/compose.log 2>&1

      - name: Package container logs
        if: always()
        run: |
          # Parametrized test names can contain characters rejected by upload-artifact.
          mkdir -p test/functional/logs
          tar -czf test/functional/logs.tar.gz -C test/functional logs

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logos-delivery-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/functional/reports/
            test/functional/logs.tar.gz
          retention-days: 14

      - name: Clean up containers and volumes
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
          docker compose down --volumes --remove-orphans
