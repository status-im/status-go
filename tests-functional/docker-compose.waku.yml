services:
  boot-1:
#    image: wakuorg/nwaku:v0.34.0
    image: nwaku-48e9ece5:latest
    entrypoint: [
      "/usr/bin/wakunode",
      "--discv5-discovery=true",
      "--discv5-enr-auto-update=True",
      "--discv5-udp-port=9000",
      "--cluster-id=16",
      # Docker DNS server
      "--dns-addrs-name-server=127.0.0.11",
      "--dns4-domain-name=boot-1",
      "--filter=true",
      "--keep-alive=true",
      "--lightpush=true",
      "--log-level=DEBUG",
      "--max-connections=18000",
      "--nodekey=03ce9122016be1f80a23df36525103bed1c7c4b9a0ff7605d97553ed8ed96bcf",  # PeerID: 16Uiu2HAm3vFYHkGRURyJ6F7bwDyzMLtPEuCg4DU89T7km2u8Fjyb
      "--peer-exchange=true",
      "--relay=true",
      "--rest-address=0.0.0.0",
      "--rest-admin",
      "--shard=32",
      "--shard=64",
#      "--staticnode=/dns4/store/tcp/60002/p2p/16Uiu2HAmCDqxtfF1DwBqs7UJ4TgSnjoh6j1RtE1hhQxLLao84jLi", # store
#      "--storenode=/dns4/store/tcp/60002/p2p/16Uiu2HAmCDqxtfF1DwBqs7UJ4TgSnjoh6j1RtE1hhQxLLao84jLi",  # store
      "--tcp-port=60001"
    ]
#    depends_on:M
#      - store

    healthcheck:
      test: ["CMD-SHELL", "curl -X GET -H 'Content-Type: application/json' http://0.0.0.0:8645 || exit 0"]
    ports:
      - "8645:8645/tcp"

