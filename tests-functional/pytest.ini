[pytest]
addopts = -v --show-capture=all

log_cli=true
log_level=DEBUG
log_cli_level=DEBUG
log_cli_format = %(asctime)s.%(msecs)03d %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

junit_logging = all

markers =
    rpc
    wallet
    wakuext
    accounts
    ethclient
    init
    transaction
    create_account
    reliability
    activity
    assets
