[pytest]
addopts = -s -v --instafail --tb=short --color=auto
log_cli=true
log_level=INFO
log_file = log/test.log
log_cli_format = %(asctime)s %(name)s %(levelname)s %(message)s 
log_file_format = %(asctime)s %(name)s %(levelname)s %(message)s 
timeout = 300
markers =
    rpc
    wallet
    tx
    wakuext
    accounts
    ethclient
    init
    transaction
    create_account
filterwarnings =
    ignore::DeprecationWarning