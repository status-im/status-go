version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - unconvert
  settings:
    dupl:
      threshold: 50
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 2
    gosec:
      excludes:
        - G115
        # TODO: triage findings from rules added between golangci-lint 2.3 and 2.12
        - G117
        - G118
        - G122
        - G201
        - G202
        - G602
        - G703
        - G704
        - G705
    govet:
      disable:
        # TODO: clean up deprecated io/ioutil usages, then enable
        - inline
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - legacy
    paths:
    - internal/contracts/
    rules:
      - linters:
          - goconst
        path: eth-node/keystore/passphrase\.go
        text: make it a constant
      - linters:
          - goconst
        path: internal/protocol/message_handler\.go
        text: make it a constant
      - linters:
          - goconst
        path: protocol/.*_test\.go
        text: make it a constant
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
      - path: (.+)\.go$
        text: 'G304: Potential file inclusion via variable'
      - path: (.+)\.go$
        text: 'G104: Errors unhandled.'
      - path: (.+)\.go$
        text: lib._Ctype_char, which can be annoying to use
      - path: (.+)\.go$
        text: SA1019
      # golangci-lint 2.12 detects hardcoded test credentials that 2.3 did not.
      - linters:
          - gosec
        path: _test\.go$
        text: 'G101:'

formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/status-im/status-go
  exclusions:
    generated: strict
    paths:
    - static
